global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'massive-traffic-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-application'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'MassiveTraffic'
          environment: 'development'